[project]
name = "weather-mcp"
version = "0.1.0"
description = "An MCP server that turns the National Weather Service API into simple, LLM-friendly weather tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.13.4",
]

[project.urls]
Repository = "https://github.com/Chewba/weather-mcp"

[project.scripts]
weather-mcp = "weather_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=1.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
